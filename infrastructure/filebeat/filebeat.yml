filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/cityshield/*.jsonl
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message
    fields:
      log_source: cityshield_simulators
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/cityshield/*.log
    json.keys_under_root: true
    json.add_error_key: true
    json.message_key: message
    fields:
      log_source: cyber_range
    fields_under_root: true

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id", "agent.id", "ecs.version", "host.name"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://opensearch:9200"]
  index: "logs-%{+yyyy.MM.dd}"
  username: "${OPENSEARCH_USER:admin}"
  password: "${OPENSEARCH_PASS:admin}"
  ssl.enabled: false
  allow_older_versions: true

setup.ilm.enabled: false
setup.template.name: "logs"
setup.template.pattern: "logs-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
