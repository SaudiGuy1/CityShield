# CityShield — Render Blueprint (frontend + backend).
#
# OpenSearch is REQUIRED (login and all data live in it) and is NOT included
# here because Render has no managed OpenSearch. Point OPENSEARCH_URL/USER/PASS
# at a managed cluster (e.g. a free Bonsai sandbox). See RENDER_DEPLOYMENT.md.
#
# The frontend's nginx reverse-proxies /api and /ws to the backend's public URL,
# which Render injects automatically via fromService (no manual wiring needed).
services:
  - type: web
    name: cityshield-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- OpenSearch (set these in the dashboard; sync:false keeps them secret) ---
      - key: OPENSEARCH_URL          # e.g. https://your-cluster.bonsaisearch.net:443
        sync: false
      - key: OPENSEARCH_USER         # Bonsai access key
        sync: false
      - key: OPENSEARCH_PASS         # Bonsai access secret
        sync: false
      # --- Auth ---
      - key: BACKEND_JWT_SECRET
        generateValue: true          # Render generates a strong secret for you
      - key: BACKEND_JWT_ALGORITHM
        value: HS256
      - key: BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DEFAULT_ADMIN_USER
        value: admin
      - key: DEFAULT_ADMIN_PASS      # set your own in the dashboard
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@cityshield.example.com
      # --- App ---
      - key: USE_MOCK_CITY_COMPONENTS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS    # irrelevant for the proxied demo (same-origin)
        value: "*"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: cityshield-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Render injects the backend's public hostname; the frontend entrypoint
      # turns a bare host into an https:// URL automatically.
      - key: BACKEND_URL
        fromService:
          type: web
          name: cityshield-backend
          property: host
