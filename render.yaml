# CityShield — Render Blueprint (demo mode, NO OpenSearch).
#
# The backend runs with USE_IN_MEMORY_STORE=true, so it keeps all data in
# process and needs NO database/search service. On startup it seeds the same
# demo data as a full stack (admin user, 10 OWASP scenarios, 75 detection rules,
# assets, sample alerts + log events). Data resets on restart — perfect for a
# free, fast demo. Two free web services, nothing else.
#
# The frontend's nginx reverse-proxies /api and /ws to the backend; Render
# injects the backend URL automatically via fromService.
services:
  - type: web
    name: cityshield-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: USE_IN_MEMORY_STORE      # demo mode — no OpenSearch needed
        value: "true"
      - key: BACKEND_JWT_SECRET
        generateValue: true           # Render generates a strong secret
      - key: BACKEND_JWT_ALGORITHM
        value: HS256
      - key: BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DEFAULT_ADMIN_USER
        value: admin
      - key: DEFAULT_ADMIN_PASS       # set your own in the dashboard
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@cityshield.example.com
      - key: USE_MOCK_CITY_COMPONENTS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS     # irrelevant for the proxied demo (same-origin)
        value: "*"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: cityshield-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Render injects the backend's public hostname; the frontend entrypoint
      # turns a bare host into an https:// URL automatically.
      - key: BACKEND_URL
        fromService:
          type: web
          name: cityshield-backend
          property: host
